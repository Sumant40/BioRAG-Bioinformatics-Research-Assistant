# render.yaml
services:
  - type: web
    name: bio-rag-api
    runtime: python
    region: oregon
    plan: free
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: NCBI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false