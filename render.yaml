# render.yaml
services:
  - type: web
    name: bio-rag-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: NCBI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false